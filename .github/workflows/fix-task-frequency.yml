name: Fix tareas por frecuencia

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-task-frequency.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Corregir lógica de tareas
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          # =========================
          # APP.TSX
          # =========================

          app_path = Path("src/app/App.tsx")
          app = app_path.read_text(encoding="utf-8")

          new_home_tasks = '''  const startOfCurrentWeekForHome = (() => {
            const date = new Date();
            const day = date.getDay();

            date.setHours(0, 0, 0, 0);
            date.setDate(
              date.getDate() -
                (day === 0 ? 6 : day - 1)
            );

            return date;
          })();

          const homeTasks = tasks
            .filter((task) => task.active)
            .map((task) => {
              const relevantClaims =
                currentUserClaims.filter((claim) => {
                  if (claim.taskId !== task.id) {
                    return false;
                  }

                  const claimDate = new Date(
                    claim.timestamp
                  );

                  if (task.frequency === "daily") {
                    return (
                      claimDate.toDateString() ===
                      todayKey
                    );
                  }

                  if (task.frequency === "weekly") {
                    return (
                      claimDate.getTime() >=
                      startOfCurrentWeekForHome.getTime()
                    );
                  }

                  return true;
                });

              const latestClaim =
                relevantClaims.sort(
                  (a, b) =>
                    new Date(
                      b.rejectedAt ??
                        b.approvedAt ??
                        b.timestamp
                    ).getTime() -
                    new Date(
                      a.rejectedAt ??
                        a.approvedAt ??
                        a.timestamp
                    ).getTime()
                )[0];

              const isCompleted =
                latestClaim?.status === "approved";

              return {
                id: task.id,
                title: task.title,
                xpReward: task.xp,
                pointsReward: task.points,
                priority: task.priority,
                completed: isCompleted
              };
            });'''

          app_pattern = re.compile(
              r'  const homeTasks = tasks\.map\(\(task\) => \{.*?\n  \}\);\n\n  const unseenRejectedClaims =',
              re.DOTALL
          )

          app, count = app_pattern.subn(
              new_home_tasks +
              "\n\n  const unseenRejectedClaims =",
              app,
              count=1
          )

          if count != 1:
              raise SystemExit(
                  f"No pude reemplazar homeTasks. Coincidencias: {count}"
              )

          app_path.write_text(
              app,
              encoding="utf-8"
          )

          # =========================
          # TASKS.TSX
          # =========================

          tasks_path = Path(
              "src/app/components/Tasks.tsx"
          )

          tasks = tasks_path.read_text(
              encoding="utf-8"
          )

          new_task_logic = '''  const getLatestClaimForTask = (task: Task) => {
            const relevantClaims = trackedUserClaims.filter((claim) => {
              if (claim.taskId !== task.id) return false;

              const claimDate = new Date(claim.timestamp);

              if (task.frequency === "daily") {
                return (
                  claimDate.toDateString() ===
                  todayKey
                );
              }

              if (task.frequency === "weekly") {
                return (
                  claimDate.getTime() >=
                  startOfCurrentWeek.getTime()
                );
              }

              return true;
            });

            return relevantClaims.sort(
              (a, b) =>
                new Date(
                  b.rejectedAt ??
                    b.approvedAt ??
                    b.timestamp
                ).getTime() -
                new Date(
                  a.rejectedAt ??
                    a.approvedAt ??
                    a.timestamp
                ).getTime()
            )[0];
          };'''

          tasks_pattern = re.compile(
              r'  const getLatestClaimForTask = \(task: Task\) => \{.*?\n  \};\n\n  const openTaskForm =',
              re.DOTALL
          )

          tasks, count = tasks_pattern.subn(
              new_task_logic +
              "\n\n  const openTaskForm =",
              tasks,
              count=1
          )

          if count != 1:
              raise SystemExit(
                  f"No pude reemplazar getLatestClaimForTask. Coincidencias: {count}"
              )

          tasks_path.write_text(
              tasks,
              encoding="utf-8"
          )

          print("✅ Lógica corregida correctamente.")
          PY

      - name: Instalar dependencias
        run: npm install --no-audit --no-fund

      - name: Comprobar compilación
        run: npm run build

      - name: Guardar corrección
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            src/app/App.tsx \
            src/app/components/Tasks.tsx

          if git diff --cached --quiet; then
            echo "No hay cambios para guardar."
            exit 0
          fi

          git commit -m "Fix daily and weekly task reset logic"
          git push
