name: Aplicar ScanGame Upgrade

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/scangame-upgrade.yml

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout completo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Recuperar archivos del upgrade original
        shell: bash
        run: |
          python <<'PY'
          import subprocess
          import textwrap
          from pathlib import Path

          commit = "a0d008e27b68ea9de5698cb50503fb833ecc1710"
          workflow_path = ".github/workflows/scangame-upgrade.yml"

          original = subprocess.check_output(
              ["git", "show", f"{commit}:{workflow_path}"],
              text=True
          )

          start_marker = "      - name: Write complete ScanGame upgrade files"
          end_marker = "      - name: Install dependencies"

          start = original.find(start_marker)
          end = original.find(end_marker, start)

          if start == -1 or end == -1:
              raise SystemExit(
                  "No pude encontrar el bloque original del upgrade."
              )

          section = original[start:end]

          run_marker = "        run: |\n"
          run_position = section.find(run_marker)

          if run_position == -1:
              raise SystemExit(
                  "No pude encontrar el script del upgrade."
              )

          script = section[
              run_position + len(run_marker):
          ]

          script = textwrap.dedent(script)

          output = Path("/tmp/scangame-upgrade.sh")
          output.write_text(
              script,
              encoding="utf-8"
          )

          print(
              "Upgrade original recuperado correctamente."
          )
          PY

          bash /tmp/scangame-upgrade.sh

      - name: Instalar dependencias
        shell: bash
        run: |
          npm install --no-audit --no-fund

      - name: Probar compilación
        shell: bash
        run: |
          npm run build

      - name: Guardar actualización de ScanGame
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No hay cambios para guardar."
            exit 0
          fi

          git commit -m "Add XP achievements notifications reminders and PWA"
          git push
