name: Reparar ScanGame Upgrade

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/scangame-upgrade.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Recuperar workflow completo y corregir npm
        shell: bash
        run: |
          python <<'PY'
          import subprocess
          from pathlib import Path

          path = ".github/workflows/scangame-upgrade.yml"

          previous = subprocess.check_output(
              ["git", "show", f"HEAD^:{path}"],
              text=True
          )

          old = """      - name: Install dependencies
                shell: bash
                run: |
                  if [ -f package-lock.json ]; then
                    npm ci
                  else
                    npm install
                  fi
          """

          new = """      - name: Install dependencies
                shell: bash
                run: |
                  npm install --no-audit --no-fund
          """

          if old not in previous:
              raise SystemExit("No encontré el bloque npm ci en el workflow anterior")

          corrected = previous.replace(old, new)

          Path(path).write_text(corrected, encoding="utf-8")

          print("Workflow completo recuperado y corregido.")
          PY

      - name: Guardar workflow corregido
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .github/workflows/scangame-upgrade.yml
          git commit -m "Fix ScanGame upgrade npm install"
          git push
