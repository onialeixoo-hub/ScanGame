name: Reparar ScanGame Upgrade

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/scangame-upgrade.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout completo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Recuperar upgrade original y corregir npm
        shell: bash
        run: |
          python <<'PY'
          import subprocess
          from pathlib import Path

          path = ".github/workflows/scangame-upgrade.yml"

          original_commit = "a0d008e27b68ea9de5698cb50503fb833ecc1710"

          original = subprocess.check_output(
              [
                  "git",
                  "show",
                  f"{original_commit}:{path}"
              ],
              text=True
          )

          if "npm ci" not in original:
              raise SystemExit(
                  "No encontré npm ci en el workflow original"
              )

          corrected = original.replace(
              "npm ci",
              "npm install --no-audit --no-fund"
          )

          Path(path).write_text(
              corrected,
              encoding="utf-8"
          )

          print(
              "Workflow original recuperado y corregido correctamente."
          )
          PY

      - name: Guardar workflow corregido
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .github/workflows/scangame-upgrade.yml
          git commit -m "Restore ScanGame upgrade with npm install"
          git push
