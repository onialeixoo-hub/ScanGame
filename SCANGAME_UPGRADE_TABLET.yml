      - name: Install dependencies
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Build ScanGame
        run: npm run build

      - name: Commit only if build passed
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html src public functions firebase.json .firebaserc FIRESTORE_RULES_COMPLETAS.txt
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Add XP achievements notifications reminders and PWA"
          git push
